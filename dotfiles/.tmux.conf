# -----------------------------------------------
# Options
# -----------------------------------------------
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

set-option -g base-index 1
set-option -g mouse on
set-option -sg escape-time 1 # shorten command delay
set-option -g xterm-keys on
set-option -g extended-keys on
set-option -g extended-keys-format csi-u # this is for pi, not super sure if it's bad
set-option -as terminal-overrides ',xterm*:sitm=\E[3m' # Italics
set-option -as terminal-overrides ',*:smxx=\E[9m' # Strikethrough
set-option -g renumber-windows on
set-option -g focus-events on
set-option -g history-limit 5000

set-window-option -g automatic-rename off
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi
set-window-option -g aggressive-resize on # constrain size to only the current window

# -----------------------------------------------
# Key Bindings
# -----------------------------------------------
bind-key r source-file ~/.tmux.conf \; display-message " Config reloaded." # reload config
bind-key e set-window-option synchronize-panes # Toggle Sync panes
bind-key -n C-q send-prefix # nested command
bind-key c new-window -n '' \; set-window-option automatic-rename on # New Window with auto-rename
bind-key s choose-session -N # disable session previews
bind-key v respawn-pane -k # restart a broken pane
bind-key | split-window -h -c '#{pane_current_path}' # split vert
bind-key - split-window -v -c '#{pane_current_path}' # split horzontal
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key y resize-pane -y 100%
bind-key -r H resize-pane -L 4
bind-key -r J resize-pane -D 4
bind-key -r K resize-pane -U 4
bind-key -r L resize-pane -R 4
bind-key < swap-window -t -1\; select-window -t -1
bind-key > swap-window -t +\; select-window -t +1
# Silenced because tmux displays any run-shell output over the current pane.
bind-key P run-shell -b 'prstatusd toggle >/dev/null 2>&1' # PR status in the window tabs
bind-key R run-shell -b 'prstatusd once >/dev/null 2>&1'   # refresh it now

# Clicking a pull request letter opens it in graphite; anywhere else on a window
# tab keeps selecting the window. Only our own ranges start with a digit.
bind-key -n MouseDown1Status if-shell -F '#{m:[0-9]*,#{mouse_status_range}}' \
  'run-shell -b "prstatusd open #{mouse_status_range} >/dev/null 2>&1"' \
  'select-window -t='



# -----------------------------------------------
# UI
# -----------------------------------------------

# active pane
set -g pane-border-style "fg=colour242"
set -g pane-active-border-style "fg=green"

# Status bar
set -g status-style "fg=white"
set -g message-style "fg=white"

# Left
set -g status-left-length 52
set -g status-interval 15
set -g status-left "#S - #[fg=white]"

# Window Tabs
# @pr (the letter) and @prnum (the pull request behind it) are pushed per window
# by prstatusd. Empty by default so a window with no pull request, or a stopped
# daemon, renders nothing.
#
# The range has to be written here rather than pushed inside @pr: tmux only
# honours a #[range=] marker present literally in the format, though it does
# expand the format in the marker's argument. It also has to come after the
# title, because #[norange] cancels the window range tmux wraps each entry in,
# and that window range is what makes a click select the window.
set-option -g @pr ''
set-option -g @prnum ''
#
# @workmux_status is the agent state, written by workmux off the Claude Code
# hooks. It takes the place of the window index while an agent is busy, so a tab
# reads [~] churning, [?] wants an answer, or [2] when nothing is running.
set-window-option -g window-status-format '#[fg=white][#{?@workmux_status,#{@workmux_status},#{window_index}}] #{b:pane_current_path}#[range=user|#{@prnum}]#{@pr}#[norange] '
set-window-option -g window-status-current-format '#[fg=green][#{?@workmux_status,#{@workmux_status},#{window_index}}] #{b:pane_current_path}#[range=user|#{@prnum}]#{@pr}#[norange] '
#set-window-option -g window-status-format '#[fg=white][#I] #{=20:window_name}'
#set-window-option -g window-status-current-format '#[fg=green][#I] #{=20:window_name}'

set -g monitor-activity on
set -g visual-activity off
set -gw window-status-activity-style "bold"

# Right
set -g status-right-length 100
set -g status-right '#(uptime | sed "s/.*load averages: \([\d\. ]*\)/\1/") | #(bom hobart -p "%%t°C") | #(pmset -g batt | grep -o "[0-9]\{1,3\}%%") | %Y-%m-%d %R'

# -----------------------------------------------
# Daemons
# -----------------------------------------------
run-shell -b 'prstatusd start >/dev/null 2>&1' # idempotent, so a config reload will not double up

# The daemon idles while nothing is attached, so pull fresh state on the way back in.
set-hook -g client-attached 'run-shell -b "prstatusd once >/dev/null 2>&1"'


